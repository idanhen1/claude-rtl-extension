<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<title>RTL Helper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div class="brandIcon">RTL</div>
        <div>
          <h1>RTL Helper</h1>
<p>Fix RTL text in Claude without breaking English or code.</p>
        </div>
      </section>

      <section class="panel">
        <div class="settingHeader">
          <div>
            <h2>Smart text direction</h2>
            <p>RTL languages get RTL. English and code stay LTR.</p>
          </div>

          <label class="switch" aria-label="Enable RTL helper">
            <input id="rtlToggle" type="checkbox" />
            <span class="track">
              <span class="thumb"></span>
            </span>
          </label>
        </div>

        <div class="statusBox">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Loading status...</span>
        </div>
      </section>

      <section class="rules">
        <div class="rule">
          <span>RTL text</span>
          <strong>RTL</strong>
        </div>
        <div class="rule">
          <span>English</span>
          <strong>LTR</strong>
        </div>
        <div class="rule">
          <span>Code</span>
          <strong>LTR</strong>
        </div>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
